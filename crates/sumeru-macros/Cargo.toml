[package]
name = "sumeru-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Procedural macros (#[gpu], #[gpu_component], #[gpu_kernel]) for Sumeru ECS GPU compute."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
