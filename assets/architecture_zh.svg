<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1325"/>
    </linearGradient>

    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065F46" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B21B6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.65"/>
    </linearGradient>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>

    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34D399"/>
    </marker>

    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Outer Canvas -->
  <rect x="2" y="2" width="1076" height="646" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1076" height="646" rx="16" fill="url(#dotGrid)"/>

  <!-- Title Header -->
  <text x="540" y="38" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="0.5">
    Sumeru — 连续列式内存状态底座架构 (Columnar State Fabric)
  </text>
  <text x="540" y="61" text-anchor="middle" fill="#94A3B8" font-size="12.5">
    关系型拓扑建模 · 二级预绑定与位图跳跃查询 · 原位状态位平面与块级脏追踪 · 两阶段事务与零拷贝列存底座
  </text>

  <!-- ========================================================================= -->
  <!-- LAYER 1: 关系型状态建模与查询执行层 (StateSpace Facade)                    -->
  <!-- ========================================================================= -->
  <rect x="28" y="80" width="1024" height="162" rx="12" fill="url(#layer1Grad)" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="44" y="70" width="330" height="22" rx="6" fill="#1D4ED8"/>
  <text x="209" y="85" text-anchor="middle" fill="#EFF6FF" font-size="12" font-weight="600">
    Layer 1 · 关系型状态建模与查询执行层 (StateSpace)
  </text>

  <!-- Card 1.1 -->
  <rect x="46" y="102" width="316" height="126" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="64" y="125" fill="#38BDF8" font-size="14" font-weight="700">关系型拓扑与实体游标</text>
  <text x="282" y="124" fill="#64748B" font-size="11" font-family="monospace">EntityRef / Mut</text>
  <line x1="64" y1="135" x2="344" y2="135" stroke="#1E293B" stroke-width="1"/>
  <text x="64" y="156" fill="#E2E8F0" font-size="12">• 一等公民关系对 <tspan fill="#7DD3FC" font-family="monospace">Pair&lt;R, Target&gt;</tspan> 与层级拓扑</text>
  <text x="64" y="178" fill="#E2E8F0" font-size="12">• 编译期零大小标签 <tspan fill="#7DD3FC" font-family="monospace">Tag&lt;N&gt;</tspan> 与全局单例 <tspan fill="#7DD3FC" font-family="monospace">Singleton</tspan></text>
  <text x="64" y="200" fill="#E2E8F0" font-size="12">• 1..=16 元组单实体零开销联合借用游标</text>

  <!-- Card 1.2 -->
  <rect x="382" y="102" width="316" height="126" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="400" y="125" fill="#38BDF8" font-size="14" font-weight="700">自适应缓存与位图跳跃查询</text>
  <text x="624" y="124" fill="#64748B" font-size="11" font-family="monospace">Query&lt;Q, F&gt;</text>
  <line x1="400" y1="135" x2="680" y2="135" stroke="#1E293B" stroke-width="1"/>
  <text x="400" y="156" fill="#E2E8F0" font-size="12">• <tspan fill="#7DD3FC" font-family="monospace">O(ΔA)</tspan> 增量原型匹配缓存 + Level-2 预绑定列槽位</text>
  <text x="400" y="178" fill="#E2E8F0" font-size="12">• <tspan fill="#7DD3FC" font-family="monospace">RowBitMask</tspan> + <tspan fill="#7DD3FC" font-family="monospace">trailing_zeros</tspan> 跨步跳跃行过滤</text>
  <text x="400" y="200" fill="#E2E8F0" font-size="12">• <tspan fill="#7DD3FC" font-family="monospace">WithFlag</tspan> / <tspan fill="#7DD3FC" font-family="monospace">ChangedSince&lt;T&gt;</tspan> / <tspan fill="#7DD3FC" font-family="monospace">WithPairTarget</tspan></text>

  <!-- Card 1.3 -->
  <rect x="718" y="102" width="316" height="126" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="736" y="125" fill="#38BDF8" font-size="14" font-weight="700">两阶段原子事务与命令缓冲</text>
  <text x="938" y="124" fill="#64748B" font-size="11" font-family="monospace">CommandBuffer</text>
  <line x1="736" y1="135" x2="1016" y2="135" stroke="#1E293B" stroke-width="1"/>
  <text x="736" y="156" fill="#E2E8F0" font-size="12">• 延迟修改录制与同实体补丁自动折叠 (Folding)</text>
  <text x="736" y="178" fill="#E2E8F0" font-size="12">• 两阶段原子预校验提交 (<tspan fill="#7DD3FC" font-family="monospace">StoreBatch</tspan>)</text>
  <text x="736" y="200" fill="#E2E8F0" font-size="12">• <tspan fill="#7DD3FC" font-family="monospace">CorePoisonGuard</tspan> 故障保护与增量收据生成</text>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <line x1="204" y1="242" x2="204" y2="274" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="242" x2="540" y2="274" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="876" y1="242" x2="876" y2="274" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 2: 连续列式状态存储内核 (Store & Archetype Kernel)                   -->
  <!-- ========================================================================= -->
  <rect x="28" y="280" width="1024" height="168" rx="12" fill="url(#layer2Grad)" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="44" y="270" width="356" height="22" rx="6" fill="#047857"/>
  <text x="222" y="285" text-anchor="middle" fill="#ECFDF5" font-size="12" font-weight="600">
    Layer 2 · 连续列式状态存储内核 (Store &amp; Archetype Kernel)
  </text>

  <!-- Card 2.1 -->
  <rect x="46" y="302" width="316" height="132" rx="9" fill="#0F172A" fill-opacity="0.9" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="64" y="325" fill="#34D399" font-size="14" font-weight="700">代际定位与倒排拓扑路由</text>
  <text x="266" y="324" fill="#64748B" font-size="11" font-family="monospace">EntityIndex</text>
  <line x1="64" y1="335" x2="344" y2="335" stroke="#1E293B" stroke-width="1"/>
  <text x="64" y="356" fill="#E2E8F0" font-size="12">• 代际实体分配器与 <tspan fill="#6EE7B7" font-family="monospace">(ArchetypeId, Row)</tspan> 直达定位</text>
  <text x="64" y="378" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">ArchetypeBitSet</tspan> 组件 → 原型倒排位图索引</text>
  <text x="64" y="400" fill="#E2E8F0" font-size="12">• 原型拓扑代际追踪 (<tspan fill="#6EE7B7" font-family="monospace">archetype_topology_epoch</tspan>)</text>
  <text x="64" y="420" fill="#94A3B8" font-size="11">位图按位与求交，免除全表扫描与字符串匹配</text>

  <!-- Card 2.2 -->
  <rect x="382" y="302" width="316" height="132" rx="9" fill="#0F172A" fill-opacity="0.9" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="400" y="325" fill="#34D399" font-size="14" font-weight="700">页对齐连续类型列存储</text>
  <text x="598" y="324" fill="#64748B" font-size="11" font-family="monospace">TypedColumn&lt;T&gt;</text>
  <line x1="400" y1="335" x2="680" y2="335" stroke="#1E293B" stroke-width="1"/>
  <text x="400" y="356" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">PageAlignedBuffer</tspan> 4KB 页对齐连续 SoA 内存列</text>
  <text x="400" y="378" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">flat_columns</tspan> 平坦列指针缓存，消除运行期哈希</text>
  <text x="400" y="400" fill="#E2E8F0" font-size="12">• 连续块切片直借 (<tspan fill="#6EE7B7" font-family="monospace">chunks</tspan> / <tspan fill="#6EE7B7" font-family="monospace">chunks_mut</tspan>) 与并行吞吐</text>
  <text x="400" y="420" fill="#94A3B8" font-size="11">100% 硬件预取友好，支持 SIMD 向量化与无交集合并</text>

  <!-- Card 2.3 -->
  <rect x="718" y="302" width="316" height="132" rx="9" fill="#0F172A" fill-opacity="0.9" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="736" y="325" fill="#34D399" font-size="14" font-weight="700">原位状态位平面与二级索引</text>
  <text x="928" y="324" fill="#64748B" font-size="11" font-family="monospace">Bit-Planes &amp; Idx</text>
  <line x1="736" y1="335" x2="1016" y2="335" stroke="#1E293B" stroke-width="1"/>
  <text x="736" y="356" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">flag_planes: [Vec&lt;u64&gt;; 8]</tspan> 非迁移行级状态位</text>
  <text x="736" y="378" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">col_chunk_epochs</tspan> 64 行块级列脏代际追踪</text>
  <text x="736" y="400" fill="#E2E8F0" font-size="12">• <tspan fill="#6EE7B7" font-family="monospace">PairTargetIndex</tspan> 原型局部关系目标位图索引</text>
  <text x="736" y="420" fill="#94A3B8" font-size="11">高频状态切换零表迁移，关系目标过滤零写放大</text>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <line x1="204" y1="448" x2="204" y2="480" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <line x1="540" y1="448" x2="540" y2="480" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <line x1="876" y1="448" x2="876" y2="480" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>

  <!-- ========================================================================= -->
  <!-- LAYER 3: 快照回溯、增量重放与零拷贝分析底座 (Open Columnar Fabric)           -->
  <!-- ========================================================================= -->
  <rect x="28" y="486" width="1024" height="140" rx="12" fill="url(#layer3Grad)" stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.5"/>
  <rect x="44" y="476" width="380" height="22" rx="6" fill="#6D28D9"/>
  <text x="234" y="491" text-anchor="middle" fill="#F5F3FF" font-size="12" font-weight="600">
    Layer 3 · 快照回溯、增量重放与零拷贝分析底座 (Open Fabric)
  </text>

  <!-- Card 3.1 -->
  <rect x="46" y="508" width="316" height="104" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="64" y="531" fill="#C4B5FD" font-size="14" font-weight="700">整列极速归档快照</text>
  <text x="276" y="530" fill="#64748B" font-size="11" font-family="monospace">rkyv Snapshot</text>
  <line x1="64" y1="540" x2="344" y2="540" stroke="#1E293B" stroke-width="1"/>
  <text x="64" y="562" fill="#E2E8F0" font-size="12">• 基于 <tspan fill="#DDD6FE" font-family="monospace">rkyv</tspan> 的整列连续内存序列化归档</text>
  <text x="64" y="584" fill="#E2E8F0" font-size="12">• 确定性时间回溯与倒排位图/代际同步恢复</text>

  <!-- Card 3.2 -->
  <rect x="382" y="508" width="316" height="104" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="400" y="531" fill="#C4B5FD" font-size="14" font-weight="700">按组件裁剪增量重放</text>
  <text x="614" y="530" fill="#64748B" font-size="11" font-family="monospace">Delta Replay</text>
  <line x1="400" y1="540" x2="680" y2="540" stroke="#1E293B" stroke-width="1"/>
  <text x="400" y="562" fill="#E2E8F0" font-size="12">• <tspan fill="#DDD6FE" font-family="monospace">CommitReceipt</tspan> 帧间变更收据与增量批次编码</text>
  <text x="400" y="584" fill="#E2E8F0" font-size="12">• 支持按表/按组件类型选择性裁剪同步</text>

  <!-- Card 3.3 -->
  <rect x="718" y="508" width="316" height="104" rx="9" fill="#0F172A" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="736" y="531" fill="#C4B5FD" font-size="14" font-weight="700">Apache Arrow 零拷贝桥接</text>
  <text x="942" y="530" fill="#64748B" font-size="11" font-family="monospace">Arrow Zero-Copy</text>
  <line x1="736" y1="540" x2="1016" y2="540" stroke="#1E293B" stroke-width="1"/>
  <text x="736" y="562" fill="#E2E8F0" font-size="12">• 页对齐连续列零拷贝导出为 Arrow Array</text>
  <text x="736" y="584" fill="#E2E8F0" font-size="12">• 直连列式分析引擎、SIMD 管线与外部运行时</text>
</svg>
